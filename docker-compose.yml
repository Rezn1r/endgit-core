version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: endgit-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: endgit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      POSTGRES_DB: endgit
    volumes:
      - endgit_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: endgit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - endgit_redisdata:/data

volumes:
  endgit_pgdata:
  endgit_redisdata:
